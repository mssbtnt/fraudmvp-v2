# ─── Regex Patterns ─────────────────────────────────────────────────────────────
# Pattern-based extraction for structured scam indicators
regex_patterns:
  - name: "whatsapp_link"
    pattern: '(?:https?://)?(?:wa\.me|api\.whatsapp\.com/send\?phone=)[^\s]+'
    weight: 35
    extract:
      type: "phone"
      transform: "extract_phone_from_wa_link"

  - name: "wasap_my_link"
    pattern: '(?:https?://)?(?:www\.)?wasap\.my/\d+'
    weight: 30
    extract:
      type: "phone"
      transform: "extract_phone_from_wa_link"

  - name: "suspicious_tld"
    pattern: '(?:https?://)?[\w\.-]+\.(?:xyz|top|tk|ga|ml|cf|click|link|work|loan)'
    weight: 30
    extract:
      type: "domain"

  - name: "deposit_amount"
    pattern: '\b(?:deposit|bayar\s+dahulu|bayar\s+dulu)\s*[\d,]+\s*(?:rm|ringgit)\b'
    weight: 28

  - name: "guaranteed_returns"
    pattern: '\b(?:janji|jamin)\s*[\d%]+\s*(?:untung|faedah|pulangan)\b'
    weight: 30

  - name: "qr_code_mention"
    pattern: '\b(?:scan|skan)\s*qr\b'
    weight: 28

  - name: "bank_account_my"
    pattern: '\b(\d{10,16})\b'
    weight: 10
    extract:
      type: "bank_account"
    context: "Must be near bank-related keywords"

  - name: "touch_n_go"
    pattern: "\\b(?:touch[\\s\\']?n[\\s\\']?go|tng|t[\\s-]?n[\\s-]?g)\\b"
    weight: 20
    notes: "Touch n Go reference — common scam target"

  - name: "duitnow_reference"
    pattern: "\\bduitnow\\b"
    weight: 22
    notes: "DuitNow reference — instant transfer scam vector"

  - name: "macau_scam_indicator"
    pattern: "\\b(?:macau[\\s-]?scam|scam[\\s-]?macau|panggil[\\s-]?telefon[\\s-]?macau|panggilan[\\s-]?macau)\\b"
    weight: 45
    notes: "Macau scam indicators"

  - name: "ah_long_indicator"
    pattern: "\\b(?:ah[\\s-]?long|loan[\\s-]?shark|pinjaman[\\s-]?ilegal|along[\\s-]?malaysia|potong[\\s-]?ayam)\\b"
    weight: 40
    notes: "Loan shark / Ah Long indicators"

  - name: "guaranteed_percentage"
    pattern: "\\b[\\d]+(?:\\.\\d+)?%\\s*(?:untung|pulangan|return|profit|faedah|gain)\\b"
    weight: 28
    notes: "Guaranteed percentage returns — investment scam"

  - name: "fake_gov_aid"
    pattern: "\\b(?:bantuan[\\s-]?kerajaan[\\s-]?tipu|bantuan[\\s-]?palsu|bkm[\\s-]?tipu|bpr[\\s-]?tipu|str[\\s-]?tipu|bsh[\\s-]?tipu)\\b"
    weight: 38
    notes: "Fake government aid references"

  - name: "telegram_invite"
    pattern: "(?:https?://)?(?:t\\.me/joinchat/|t\\.me/\\+)[^\\s]+"
    weight: 25
    notes: "Telegram group invite — recruitment for scams"

  - name: "urgency_pressure"
    pattern: "\\b(?:sekarang[\\s-]?je|terhad[\\s-]?je|last[\\s-]?slot|slot[\\s-]?terhad|cepat[\\s-]?daftar|daftar[\\s-]?sekarang)\\b"
    weight: 18
    notes: "Urgency pressure phrases"

  - name: "transfer_pressure"
    pattern: "\\b(?:transfer[\\s-]?dulu|bank[\\s-]?in[\\s-]?dulu|bayar[\\s-]?dulu|hantar[\\s-]?duit[\\s-]?dulu)\\b"
    weight: 32
    notes: "Advance fee / transfer pressure"

