- pattern: \b(hilang|kehilangan|rugi)\s+(duit|wang|RM|ringgit|money)\b
  weight: 45
  description: Loss of money stated
- pattern: \b(sudah|da|telah)\s+(transfer|bank\s*in|hantar)\s+(duit|RM|wang)\b
  weight: 35
  description: Money transferred to scammer
- pattern: \b(duit|wang|money)\s+(hilang|rugi|tipu|scammed)\b
  weight: 35
  description: Money lost/missing
- pattern: \b(tipu|scam|con)\s+(RM|ringgit|duit|wang)\b
  weight: 40
  description: Scam with amount mentioned
- pattern: \bscammed\b
  weight: 35
  description: English 'scammed' keyword
- pattern: \bkena\s+scam\b
  weight: 40
  description: Malay-English hybrid scam admission
- pattern: \bfraud\b
  weight: 30
  description: Fraud keyword
- pattern: \bdefrauded\b
  weight: 35
  description: Defrauded keyword
police_report:
- pattern: \b(police|polis)\s+(report|laporan|aduan)\b
  weight: 35
  description: Police report mentioned
- pattern: \b(buat|filed|made)\s+(laporan|report|aduan)\b
  weight: 30
  description: Report filed
- pattern: \bpolis\s+report\b
  weight: 35
  description: Police report (English-Malay)
- pattern: \blaporan\s+polis\b
  weight: 35
  description: Laporan polis (Malay)
- pattern: \breport\s+to\s+(pdrm|polis|bukit\s+aman)\b
  weight: 30
