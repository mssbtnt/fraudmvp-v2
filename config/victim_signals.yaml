amount_mentioned:
- pattern: \bRM[\d,]+(?:\.\d{2})?\b
  weight: 30
  description: RM amount (e.g., RM50,000)
  extract: true
- pattern: \bRM\s*[\d,]+(?:\.\d{2})?\b
  weight: 30
  description: RM amount with space
  extract: true
- pattern: \brm\s*[\d,]+(?:\.\d{2})?\b
  weight: 30
  description: rm amount (lowercase)
  extract: true
- pattern: \b([\d,]+(?:\.\d{2})?)\s*(ringgit|RM)\b
  weight: 30
  description: Amount before currency
  extract: true
- pattern: \bRM\s*(\d+)[Kk]\b
  weight: 30
  description: RM amount with K suffix (e.g., RM3K = RM3,000)
  extract: true
  multiplier: 1000
- pattern: \brm\s*(\d+)[Kk]\b
  weight: 25
  description: rm amount with K suffix lowercase (e.g., rm3k)
  extract: true
  multiplier: 1000
- pattern: \bRM\s*(\d+)[Mm]\b
  weight: 30
  description: RM amount with M suffix (e.g., RM5M = RM5,000,000)
  extract: true
  multiplier: 1000000
