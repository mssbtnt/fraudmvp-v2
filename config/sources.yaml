# Malaysian & Southeast Asian Scam Reporting Sources
# Sources scraped in priority order — accessible sites first

seed_sources:
  # ─── Malaysian Government / CERT (HIGHEST PRIORITY — verified accessible) ────
  - name: MyCERT Fraud Alerts
    url: https://www.mycert.org.my
    type: advisories
    platform: web
    weight: 0.95
    priority: high
    entity_types: [phone, domain, url, email]
    notes: Malaysia's official computer emergency response team — live scam advisories

  - name: MyCERT Advisories Index
    url: https://www.mycert.org.my/portal/index
    type: advisories
    platform: web
    weight: 0.95
    priority: high
    entity_types: [phone, domain, url]
    notes: Index page with links to all advisories

  # ─── Consumer Advocacy (verified accessible) ─────────────────────────────────
  - name: Consumers Association of Penang
    url: https://www.consumer.org.my
    type: complaint_db
    platform: web
    weight: 0.75
    priority: medium
    entity_types: [phone, domain, url]
    notes: Consumer protection organization — scam complaints section

  # ─── OpenSanctions Government Alert Lists ───────────────────────────────────
  - name: BNM Financial Consumer Alert (OpenSanctions Mirror)
    url: https://data.opensanctions.org/datasets/my_consumer_alert_list/targets.nested.json
    type: gov_alert_list
    platform: opensanctions
    weight: 0.95
    priority: high
    entity_types: [domain, url, telegram_channel, phone, company_name]
    notes: Bank Negara Malaysia — unlicensed financial service providers (~1,170 entities)

  - name: SC Investor Alert (OpenSanctions Mirror)
    url: https://data.opensanctions.org/datasets/my_investor_alert_list/targets.nested.json
    type: gov_alert_list
    platform: opensanctions
    weight: 0.90
    priority: high
    entity_types: [domain, url, telegram_channel, phone, company_name]
    notes: Securities Commission Malaysia — unregistered investment platforms (~1,855 entities)

# ─── Supplementary — Social Media (trend intelligence, low entity yield) ────────
  - name: Reddit r/malaysia
    url: https://www.reddit.com/r/malaysia
    type: community_forum
    platform: reddit
    weight: 0.4
    priority: low
    entity_types: [phone, domain, url]
    notes: General Malaysia subreddit — supplementary research source only; does not feed extraction, scoring, or alerting
    search_queries: [scam, penipu, tipu, fraud, macau scam, phishing, ah long]
    max_posts_per_query: 10
    scrape_mode: search_only
    session_file: data/reddit_session.json

# Telegram seed channels — populate from web-scraped @usernames
# These are bootstrapped from web sources and resolved via Telethon
telegram_seeds: []

# Telegram discovery hubs — bots can read messages from these public channels
telegram_discovery_hubs:
  - username: spam
    title: Spam Reports
  - username: ScamAlertsChannel
    title: Scam Alerts Channel
  - username: ExposedScammers
    title: Exposed Scammers

# Platform weights for multi-source scoring
platform_weights:
  telegram: 1.0
  facebook: 0.7
  tiktok: 0.6
  reddit: 0.5
  x: 0.5
  web: 0.8

# Collection settings
collection:
  telegram:
    messages_per_channel: 100
    max_channels_per_keyword: 20
    rate_limit_seconds: 3
    demo_mode: false

  web:
    request_timeout_seconds: 30
    max_retries: 3
    delay_between_requests_seconds: 5
    max_pages_per_source: 20
    extract_telegram_refs: true

  reddit:
    subreddit: malaysia
    search_queries: [scam, penipu, tipu, fraud, macau scam, phishing, ah long]
    max_posts_per_query: 10
    scrape_mode: search_only
    use_old_reddit: true
    session_file: data/reddit_session.json
    rate_limit_seconds: 5
    entity_extraction: false
    trend_intelligence: true
    pipeline_integration: false
    promotion:
      enabled: false
      min_scam_relevance: 0.67
      min_text_length: 120
      require_entity_types: [phones, bank_accounts, whatsapp_links, urls]
